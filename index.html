<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#14161d" />
    <title>Spaceblast</title>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <canvas id="game"></canvas>
    <div id="hud">
      <span class="title">SPACEBLAST</span>
      <span id="hud-info"></span>
      <button id="new-map" type="button">New map</button>
    </div>
    <div id="stick-zone" aria-label="Movement joystick">
      <div id="stick-base"><div id="stick-knob"></div></div>
    </div>
    <div id="action-zone">
      <button id="place-btn" type="button" aria-label="Place charge">CHARGE</button>
    </div>
    <div id="rotate">
      <div>Rotate your phone to landscape</div>
    </div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
