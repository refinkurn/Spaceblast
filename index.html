<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#14161d" />
    <title>Spaceblast</title>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <canvas id="game"></canvas>
    <div id="hud">
      <span class="title">SPACEBLAST</span>
      <span id="hud-info"></span>
      <button id="menu-btn" type="button">Menu</button>
    </div>
    <div id="stick-zone" aria-label="Movement joystick">
      <div id="stick-base"><div id="stick-knob"></div></div>
    </div>
    <div id="action-zone">
      <button id="place-btn" type="button" aria-label="Place charge">CHARGE</button>
    </div>
    <div id="banner" hidden>
      <div id="banner-title"></div>
      <div id="banner-text"></div>
      <div class="actions">
        <button id="banner-btn" type="button"></button>
        <button id="banner-menu" class="quiet" type="button">Menu</button>
      </div>
    </div>
    <div id="menu">
      <h1>SPACEBLAST</h1>
      <p class="tagline">Animal astronauts vs hungry Martians</p>
      <div class="modes">
        <button id="mode-survival" type="button">
          <strong>Survival</strong>
          <span>Clear the Martians, find the Warp Gate</span>
        </button>
        <button id="mode-battle" type="button">
          <strong>Battle vs bot</strong>
          <span>Last astronaut standing, first to 3 rounds</span>
        </button>
      </div>
      <p class="controls">Move: arrows / WASD or drag on the left · Charge: Space / X or the right button</p>
    </div>
    <div id="rotate">
      <div>Rotate your phone to landscape</div>
    </div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
