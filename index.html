<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#14161d" />
    <title>Spaceblast</title>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <canvas id="game"></canvas>
    <div id="hud">
      <span class="title">SPACEBLAST</span>
      <div id="hud-health" class="hud-health" aria-label="Lives and armor"></div>
      <div id="hud-stage" class="hud-chip"></div>
      <div id="hud-goal" class="hud-goal"></div>
      <div id="hud-powers" class="hud-powers"></div>
      <button id="menu-btn" type="button">Menu</button>
    </div>
    <div id="stick-zone" aria-label="Movement joystick">
      <div id="stick-base"><div id="stick-knob"></div></div>
    </div>
    <div id="action-zone">
      <button id="place-btn" type="button" aria-label="Place charge">CHARGE</button>
    </div>
    <div id="alert" hidden></div>
    <div id="banner" hidden>
      <div id="banner-title"></div>
      <div id="banner-text"></div>
      <div class="actions">
        <button id="banner-btn" type="button"></button>
        <button id="banner-menu" class="quiet" type="button">Menu</button>
      </div>
    </div>
    <div id="story" hidden>
      <div class="story-card">
        <div id="story-kicker" class="kicker"></div>
        <h2 id="story-title"></h2>
        <p id="story-text"></p>
        <button id="story-btn" type="button">Begin</button>
      </div>
    </div>
    <div id="level-card" hidden>
      <div id="card-title" class="kicker"></div>
      <div id="card-context" class="context"></div>
      <div id="card-goal" class="goal"></div>
      <div id="card-hazards" class="hazards"></div>
    </div>
    <div id="menu">
      <h1>SPACEBLAST</h1>
      <p class="tagline">Animal astronauts vs hungry Martians</p>
      <div class="modes">
        <button id="mode-survival" type="button">
          <strong>Story Mode</strong>
          <span>4 sectors, 20 levels, 3 bosses and a final duel</span>
        </button>
        <button id="mode-battle" type="button">
          <strong>Battle vs bot</strong>
          <span>Last astronaut standing, first to 3 rounds</span>
        </button>
        <button id="mode-online" type="button">
          <strong>Play online</strong>
          <span>Battle friends with a room code, 2–4 players</span>
        </button>
      </div>
      <p class="controls">Move: arrows / WASD or drag on the left · Charge: Space / X or the right button</p>
    </div>
    <div id="online" hidden>
      <div class="online-card">
        <div class="kicker">Play online</div>
        <div id="online-choose">
          <button id="online-create" type="button" class="primary">Create room</button>
          <div class="online-join">
            <input id="online-code" maxlength="4" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="CODE" aria-label="Room code" />
            <button id="online-join" type="button">Join</button>
          </div>
        </div>
        <div id="online-lobby" hidden>
          <div class="online-code-label">Room code</div>
          <div id="online-room" class="online-room"></div>
          <ul id="online-players"></ul>
          <button id="online-start" type="button" class="primary">Start match</button>
        </div>
        <div id="online-status" class="online-status"></div>
        <button id="online-back" type="button" class="quiet">Back</button>
      </div>
    </div>
    <div id="rotate">
      <div>Rotate your phone to landscape</div>
    </div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
