# Cloudflare deploy for Spaceblast: the game page plus online rooms.
# `npm run deploy` builds dist/ and uploads both. See ONLINE.md.
name = "spaceblast"
main = "server/worker.ts"
compatibility_date = "2026-09-01"

[assets]
directory = "./dist"
binding = "ASSETS"
run_worker_first = ["/room/*", "/api/*"]

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "RoomObject"

[[durable_objects.bindings]]
name = "LEADERBOARD"
class_name = "LeaderboardObject"

# Free plan: Durable Objects must use the SQLite storage backend.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["RoomObject"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["LeaderboardObject"]
