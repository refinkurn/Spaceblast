name: Test

# Every push to main: unit tests, builds (page, Fly server, portal zip), then
# phone-size screenshots of the key screens (fails on a script error, a blank
# arena or a missing screen). Deploys happen elsewhere: Vercel builds the page
# and Cloudflare Workers Builds deploys the rooms (see ONLINE.md); live.yml
# checks the result.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run build:server
      - run: npm run build:portal
      - uses: actions/upload-artifact@v4
        with:
          name: spaceblast-portal
          path: spaceblast-portal.zip
          retention-days: 14

  screens:
    # Pinned: the browser download for this Playwright version has no build for newer runners.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run shots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screens
          path: shots/
          retention-days: 14
